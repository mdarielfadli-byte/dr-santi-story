<body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><a class="wordmark" href="index.html">Dr Santi’s <span>Story</span></a><button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button><nav id="site-nav" class="site-nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="programs-services.html">Programs &amp; Services</a><a class="active" href="stories-resources.html">Stories &amp; Resources</a><a class="nav-cta" href="contact.html">Contact</a></nav></header><main id="main"></main><footer class="site-footer"><a class="wordmark" href="index.html">Dr Santi’s <span>Story</span></a><p>Reading, leadership &amp; lifelong learning.</p><p>© 2026 Dr Santi’s Story</p></footer><script src="script.js"></script><script>
const posts={
 'reading-together':['Parenting & reading','How reading together can begin at home','Reading does not need to begin with a page target. It can begin with one small moment when a child feels that a book is a welcoming place to return to.','assets/dr-santi-reading.webp','We often want children to love reading because we know how much there is to discover in a book. But when that hope becomes a target, reading can start to feel like another task.',['Start with a time that can be repeated','Let books be visible in everyday life','Make room for conversation']],
 'reading-ritual':['Reading ritual','Fifteen minutes that make room for a story','A small, regular reading ritual gives stories a natural place in the day.','assets/dr-santi-portrait.webp','A reading ritual does not have to be elaborate. It only needs to be kind enough to return to tomorrow.',['Choose a realistic moment','Keep the invitation open','Let repetition do its work']],
 'shared-room':['Community','What a shared reading room can hold','When people gather around books, a room can become a place to listen, recognise, and imagine together.','assets/cartea/cartea-01.webp','A shared reading room is never only about the books on display. It is about the permission people feel to speak, listen, and be changed by a story.',['Begin with welcome','Let many voices enter','Carry one thing home']],
 'early-literacy':['Early literacy','Let children meet books with curiosity','Early literacy grows through connection, play, language, and the feeling that books belong to a child’s world.','assets/cartea/cartea-02.webp','Children do not need to be pushed toward books. They need the chance to meet stories with interest and without pressure.',['Follow the child’s attention','Read the pictures too','Keep it relational']],
 'questions':['Learning culture','The questions we carry after a good story','A good story does not close a conversation. It gives people something to keep wondering about.','assets/cartea/cartea-03.webp','Reading shapes more than what we know. It shapes the questions we are willing to carry with us.',['Pause before explaining','Ask what feels close','Keep the question alive']],
 'attention':['Reflection','Reading as a practice of paying attention','A reading life can help us notice more carefully: a phrase, a person, a feeling, and the world around us.','assets/cartea/cartea-04.webp','In a busy day, reading can become a quiet practice of staying with what matters long enough to notice it.',['Choose depth over speed','Make space for response','Return when you are ready']]
};
const selectedPost=new URLSearchParams(location.search).get('post')||'reading-together';
const post=posts[selectedPost]||posts['reading-together'];
const relatedPosts=Object.entries(posts).filter(([slug])=>slug!==selectedPost).slice(0,3);
document.title=`${post[1]} | Dr Santi’s Story`;
document.querySelector('#main').innerHTML=`<article class="article-page"><header class="article-header"><a class="back-link" href="articles.html">← All articles</a><p class="eyebrow">${post[0]}</p><h1>${post[1]}</h1><p class="article-dek">${post[2]}</p><p class="byline">By Dr Santi’s Story</p></header><figure class="article-feature-image"><img src="${post[3]}" alt=""><figcaption>${post[0]}</figcaption></figure><div class="article-body"><p>${post[4]}</p>${post[5].map((heading,index)=>`<h2>${index+1}. ${heading}</h2><p>Small, repeatable moments make room for a reading life. There is no single right way to begin; attention, conversation, and a sense of welcome are often enough.</p>`).join('')}<aside class="article-pullquote">“The aim is not to finish quickly, but to make someone want to return.”</aside><section class="article-cta"><p class="eyebrow">For families &amp; communities</p><h2>Would you like to create more room for reading together?</h2><a class="button button-primary" href="contact.html">Start a conversation <span>→</span></a></section></div></article><section class="related-articles section-shell"><div class="related-articles-heading"><div><p class="eyebrow">Keep reading</p><h2>Related articles</h2></div><a class="text-link" href="articles.html">View all articles →</a></div><div class="article-card-grid">${relatedPosts.map(([slug,item])=>`<article class="article-card"><img src="${item[3]}" alt=""><div><p class="eyebrow">${item[0]}</p><h3>${item[1]}</h3><a href="article.html?post=${slug}">Read more →</a></div></article>`).join('')}</div></section>`;
</script></body></html>
